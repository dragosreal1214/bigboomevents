<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Backoffice — BigBoomEvents</title>
<link rel="icon" href="/assets/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/styles.css" />
<link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

<!-- ─────────── LOGIN ─────────── -->
<section id="login" class="login-wrap" hidden>
  <form class="login-card card-block" id="login-form" novalidate>
    <div class="login-logo"><span class="dot"></span> BigBoomEvents</div>
    <h1>Backoffice</h1>
    <p class="muted">Conectează-te ca să administrezi produsele și categoriile.</p>
    <div class="notice err" id="login-error" hidden></div>
    <div class="field">
      <label>Parolă</label>
      <input class="input" type="password" id="login-password" autocomplete="current-password" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="login-submit">Intră în panou</button>
  </form>
</section>

<!-- ─────────── APP ─────────── -->
<div id="app" hidden>
  <header class="admin-bar">
    <div class="admin-bar-in">
      <a class="admin-logo" href="/admin/"><span class="dot"></span> BigBoomEvents <span class="pill">admin</span></a>
      <nav class="admin-tabs">
        <button class="tab" data-tab="dashboard">Panou</button>
        <button class="tab" data-tab="products">Produse</button>
        <button class="tab" data-tab="categories">Categorii</button>
        <button class="tab" data-tab="orders">Comenzi</button>
        <button class="tab" data-tab="leads">Cereri</button>
      </nav>
      <div class="admin-bar-right">
        <a href="/" target="_blank" class="link-site">Vezi site-ul ↗</a>
        <button class="btn btn-ghost btn-sm" id="logout">Ieși</button>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <!-- DASHBOARD -->
    <section class="view" data-view="dashboard">
      <h2 class="view-title">Panou</h2>
      <div class="stat-grid" id="stat-grid"></div>
      <div class="quick-actions">
        <button class="btn btn-primary" data-new-product>+ Adaugă produs</button>
        <button class="btn btn-ghost" data-go="categories">Gestionează categorii</button>
      </div>
    </section>

    <!-- PRODUCTS -->
    <section class="view" data-view="products" hidden>
      <div class="view-head">
        <h2 class="view-title">Produse</h2>
        <button class="btn btn-primary" data-new-product>+ Adaugă produs</button>
      </div>
      <div class="toolbar">
        <input class="input" id="product-search" placeholder="Caută după nume…" />
        <select class="select" id="product-cat-filter"><option value="">Toate categoriile</option></select>
      </div>
      <div id="products-list" class="table-wrap"></div>
    </section>

    <!-- CATEGORIES -->
    <section class="view" data-view="categories" hidden>
      <div class="view-head">
        <h2 class="view-title">Categorii</h2>
        <button class="btn btn-primary" id="new-category">+ Adaugă categorie</button>
      </div>
      <div id="categories-list" class="table-wrap"></div>
    </section>

    <!-- ORDERS -->
    <section class="view" data-view="orders" hidden>
      <div class="view-head"><h2 class="view-title">Comenzi</h2></div>
      <div class="toolbar">
        <input class="input" id="order-search" placeholder="Caută nr. comandă, nume, email…" />
        <select class="select" id="order-status-filter"><option value="">Toate statusurile</option></select>
      </div>
      <div id="orders-list" class="table-wrap"></div>
    </section>

    <!-- LEADS -->
    <section class="view" data-view="leads" hidden>
      <div class="view-head"><h2 class="view-title">Cereri de ofertă</h2></div>
      <div class="toolbar">
        <select class="select" id="lead-status-filter"><option value="">Toate statusurile</option></select>
      </div>
      <div id="leads-list" class="table-wrap"></div>
    </section>
  </main>
</div>

<!-- ─────────── DRAWER (editor produs / categorie) ─────────── -->
<div class="drawer-overlay" id="drawer" hidden>
  <div class="admin-drawer" role="dialog" aria-modal="true">
    <div class="admin-drawer-head">
      <h3 id="drawer-title">Produs</h3>
      <button class="x-abs" data-drawer-close aria-label="Închide">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<div id="toast" class="admin-toast" hidden></div>

<script src="/admin/admin.js"></script>
</body>
</html>
