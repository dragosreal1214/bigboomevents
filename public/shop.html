<head>
<meta charset="UTF-8" />

<meta property="og:locale" content="ro_RO" />
<meta property="og:title" content="Shop — The Big Boom Events" />
<meta property="og:description" content="Magazin The Big Boom Events: florărie, baloane și accesorii de petrecere. Filtrează după categorie, preț, ocazie și culoare." />

<body data-page="shop">
<div data-include="promo"></div>

<div data-include="nav"></div>

<main class="wrap">
  <div class="crumb"><a href="/">Acasă</a> · Shop</div>

  <!-- Intro de categorie (florărie/baloane) — populat din shop.js când e activă o categorie. -->
  <div class="cat-intro" data-cat-intro hidden></div>

  <div class="section-head" data-shop-head style="margin:6px auto 30px">
    <span class="eyebrow">Shop</span>
    <h2>Alege din colecții</h2>
    <p>Filtrează după categorie, preț, ocazie sau culoare. Comandă online sau cere o ofertă.</p>
  </div>

  <!-- QUICK FILTERS — populate din shop.js (diferă pe categorie) -->
  <div class="quick-filters" data-quick-filters role="group" aria-label="Filtre rapide"></div>

  <div class="shop-layout">
    <!-- SIDEBAR FILTERS -->
    <aside class="sidebar collapsed" data-sidebar>
      <div class="filter-group" data-cat-group>
        <h4>Categorie</h4>
        <div data-filter-categories></div>
      </div>
      <div class="filter-group" data-filter-section hidden>
        <h4>Tip produs</h4>
        <div class="filter-scroll" data-filter-types></div>
      </div>
      <div class="filter-group">
        <h4>Preț (lei)</h4>
        <div class="range-row">
          <input type="number" class="input" min="0" placeholder="min" data-min-price style="padding:8px" />
          <span>—</span>
          <input type="number" class="input" min="0" placeholder="max" data-max-price style="padding:8px" />
        </div>
        <input type="range" min="0" max="500" step="10" value="500" data-price-slider style="margin-top:12px" />
        <div class="muted" style="font-size:13px">până la <span data-price-slider-label>500</span> lei</div>
      </div>
      <div class="filter-group" data-occ-group>
        <h4 data-occ-head>Ocazie</h4>
        <div class="filter-scroll" data-filter-occasions></div>
      </div>
      <div class="filter-group">
        <h4>Culoare</h4>
        <div data-filter-colors></div>
      </div>
      <div class="filter-group">
        <label class="checkline"><input type="checkbox" data-in-stock /> Doar în stoc</label>
      </div>
      <button class="btn btn-ghost btn-sm btn-block" data-clear-filters>Resetează filtrele</button>
    </aside>

    <!-- RESULTS -->
    <div>
      <div class="shop-toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" placeholder="Caută produse…" data-search aria-label="Caută" />
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <button class="btn btn-ghost btn-sm filter-toggle" data-toggle-filters>Filtre</button>
          <select class="select" data-sort aria-label="Sortează">
            <option value="recomandat">Recomandate</option>
            <option value="nou">Cele mai noi</option>
            <option value="pret-asc">Preț crescător</option>
            <option value="pret-desc">Preț descrescător</option>
            <option value="nume">Alfabetic</option>
          </select>
        </div>
      </div>
      <p class="count" data-count></p>
      <div class="grid" data-grid></div>
      <div class="center" style="margin-top:30px"><button class="btn btn-dark" data-load-more hidden>Încarcă mai multe</button></div>
    </div>
  </div>
</main>

<div data-include="footer"></div>
<!-- Sigla NETOPIA (obligatorie pentru punctul de vânzare). Trebuie să stea în
     markup static: un <script> extern injectat prin outerHTML nu s-ar executa.
     app.js îl mută în footer, lângă bannerele ANPC. -->
<div data-netopia><script src="https://mny.ro/npId.js?p=167581" data-version="orizontal" data-contrast-color="#3b2e3a"></script></div>

<script defer src="/js/app.js?v=portal15o"></script>
<script defer src="/js/cards.js?v=portal15o"></script>
<script defer src="/js/shop.js?v=portal15o"></script>
</body>
</html>
